name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The VST3 SDK dominates configure time and only changes when the
      # submodule pointer does.
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-tests
          key: ${{ runner.os }}-cmake-${{ hashFiles('.gitmodules', 'CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-cmake-

      - name: Configure
        run: cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug -DDAVE_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests --target dave_tests -j3

      # No audio device and no display on a CI runner — dave_tests is built
      # from selected sources precisely so it needs neither.
      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  app:
    name: App builds (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j3

      # Checks the documented entry point exists. `./build/Dave` is a symlink
      # CMake creates into the .app bundle; it silently didn't exist in fresh
      # build trees until CI caught that.
      - name: Check the app binary is where the docs say
        run: |
          test -x ./build/Dave
          test -x ./build/Dave.app/Contents/MacOS/Dave

      # Deliberately NOT run here: `./build/Dave --screenshot`. It needs a
      # window server to create a GL context, and the runner has none — GLFW
      # fails with "failed to create GLFW window". Rendering is verified
      # locally instead. Making this work in CI needs a headless GL path
      # (offscreen framebuffer without a window), which the harness doesn't
      # have yet.
