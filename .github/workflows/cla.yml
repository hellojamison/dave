name: CLA

# Requires every contributor to sign the Harmony CLA before their first pull
# request can merge. Signatures are recorded in a JSON file on a dedicated
# branch, so the check is durable across forks and repo transfers.
#
# SETUP (one-time, before making the repo public):
#   1. Fill in [JURISDICTION] in docs/cla.md section 6.1 — it's the only
#      remaining blank in the agreement, and contributors are agreeing to that
#      document.
#   2. The cla-signatures branch already exists locally; push it:
#        git push -u origin cla-signatures
#   3. Settings > Actions > General > Workflow permissions:
#      enable "Read and write permissions".
#   4. Make this check required: Settings > Branches > main branch protection.
#
# If the repository is not published as hellojamison/dave, update
# path-to-document below to match.
#
# pull_request_target (not pull_request) is deliberate: forked PRs need write
# access to record the signature, which pull_request does not grant. This
# workflow must therefore never check out or execute PR-authored code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          startsWith(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/hellojamison/dave/blob/main/docs/cla.md
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged we need you to
            sign the Contributor Licence Agreement — it keeps Dave's
            dual-licensing option viable. You keep copyright in your work; see
            CONTRIBUTING.md for what the agreement does and doesn't do.
            To sign, post a comment on this PR containing exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
